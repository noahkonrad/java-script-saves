<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My JavaScript Projects</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      line-height: 1.6;
      padding: 2rem 1rem;
    }

    header {
      max-width: 900px;
      margin: 0 auto 3rem auto;
      text-align: center;
    }

    header h1 {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
      color: var(--accent);
    }

    header p {
      color: var(--text-muted);
      font-size: 1.1rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.5rem;
      max-width: 900px;
      margin: 0 auto;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 1.5rem;
      text-decoration: none;
      color: inherit;
      border: 1px solid #334155;
      transition: transform 0.2s ease, border-color 0.2s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
    }

    .day-badge {
      display: inline-block;
      background-color: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      font-size: 0.8rem;
      font-weight: 700;
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
      margin-bottom: 0.75rem;
      width: fit-content;
    }

    .card h2 {
      font-size: 1.25rem;
      margin-bottom: 0.5rem;
    }

    .card p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>JavaScript Daily Log</h1>
    <p>A collection of my daily JavaScript builds and experiments.</p>
  </header>

  <main class="grid" id="project-grid"></main>

  <script>
    // Add your daily folders here
    const projects = [
      {
        day: 1,
        title: "starting out",
        folder: "November12th",
        description: "Keyboard events and audio playback."
      },
      {
        day: 2,
        title: "JS Clock",
        folder: "day2",
        description: "Real-time analog clock using CSS transforms."
      },
      {
        day: 3,
        title: "CSS Variables",
        folder: "day3",
        description: "Updating styles dynamically with range sliders."
      }
    ];

    const grid = document.getElementById("project-grid");

    projects.forEach((project) => {
      const card = document.createElement("a");
      card.className = "card";
      // Relative path works automatically on GitHub Pages
      card.href = `./${project.folder}/`;

      card.innerHTML = `
        <div>
          <span class="day-badge">Day ${project.day}</span>
          <h2>${project.title}</h2>
          <p>${project.description}</p>
        </div>
      `;

      grid.appendChild(card);
    });
  </script>

</body>
</html>
